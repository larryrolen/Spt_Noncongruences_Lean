# Self-reported metadata for the conditional Palomar submission.
# Registration requires the full Palomar workflow and editorial review.
version: v0.4
project:
  name: "Canonical congruences for the smallest parts function, conditional on explicit inputs"
  description: >-
    This development formalizes the classification of canonical congruence
    primes for Andrews' smallest-parts function: the primes are exactly 5, 7,
    and 13. A canonical congruence uses the residue inverse to 24 modulo a
    prime at least five. The formal endpoint takes explicit literature, application, and
    analytic-model hypotheses, documented as E1-E11 in ASSUMPTIONS.md and
    EXTERNAL_INPUTS.json. The development derives the normalized
    Borcherds/class-polynomial product identity, the Wronskian obstruction,
    large-prime exclusion, and final classification relative to those inputs.
    It does not supply formal proofs of all the external inputs. The E8
    interfaces are additional unproved application assumptions, not certified
    translations of cited CM results. Only the main classification is selected;
    routine supporting lemmas are proved prerequisites.
    The analytic boundary includes explicit genus-zero descent for genuine
    unitary meromorphic functions with zero cusp orders. Full point-divisor
    rigidity for nonzero rational functions is proved internally.
  authors:
    - Larry Rolen
  responsible_maintainers:
    - Larry Rolen
  license: MIT
